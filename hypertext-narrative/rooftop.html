<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Died | The Police Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/rooftop.css">
</head>
<body>
  <main class="stage">
    <!-- Rooftop background image is set in rooftop.css -->
    <div class="vignette" aria-hidden="true"></div>
    <div class="flash" aria-hidden="true"></div>

    <!-- The Tyrant: pure CSS silhouette -->
    <div class="tyrant" role="img" aria-label="A towering silhouette looming over you on the rooftop, its eyes glowing red.">
      <span class="eye eye-left"></span>
      <span class="eye eye-right"></span>
    </div>

    <!-- Claw slashes across the screen -->
    <div class="slashes" aria-hidden="true">
      <span class="slash s1"></span>
      <span class="slash s2"></span>
      <span class="slash s3"></span>
    </div>

    <header class="heading">
      <h1>You Died</h1>
      <p class="story">
        The rooftop door slams shut behind you. The footsteps shake the concrete,
        and the Tyrant steps out of the dark. There is nowhere to run.
        <strong>It crushes you before you can scream.</strong>
      </p>
    </header>

    <a class="back" href="index.html">
      <span class="arrow" aria-hidden="true">&larr;</span>
      Wake up in the lobby
    </a>
  </main>
</body>
</html>
